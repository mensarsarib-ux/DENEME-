workflows:
  hesabim-ios:
    name: Hesabım iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Codemagic'teki Apple Developer Portal anahtarının adı (birebir aynı olmalı)
      app_store_connect: CodemagicAdmin
    environment:
      groups:
        # Codemagic'te "supabase" ortam grubu: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        - supabase
      vars:
        APP_BUNDLE_ID: "com.mensar.hesabim"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mensar.hesabim
      xcode: latest
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/hesabim-splash-dashboard"
          include: true
    scripts:
      - name: Paketleri kur
        script: npm ci
      - name: Web uygulamasını derle
        script: npm run build
      - name: Capacitor ile iOS projesine kopyala
        script: npx cap sync ios
      - name: CocoaPods bağımlılıklarını kur
        script: cd ios/App && pod install
      - name: Xcode projesine profilleri bağla
        script: xcode-project use-profiles
      - name: IPA üret
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
