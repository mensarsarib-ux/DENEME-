workflows:
  hesabim-ios:
    name: Hesabım iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        # Codemagic'te "supabase" ortam grubu: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        - supabase
      vars:
        APP_BUNDLE_ID: "com.mensar.hesabim"
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "claude/hesabim-splash-dashboard"
          include: true
    scripts:
      - name: Paketleri kur
        script: npm ci
      - name: Web uygulamasını derle
        script: npm run build
      - name: Capacitor ile iOS projesine kopyala
        script: npx cap sync ios
      - name: CocoaPods bağımlılıklarını kur
        script: cd ios/App && pod install
      # İmzalama ve IPA üretimi: Apple Developer hesabı ve App Store Connect bağlantısı hazır olunca tamamlanacak
    artifacts:
      - build/ios/ipa/*.ipa
