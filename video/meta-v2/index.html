<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000;}
  body{width:1080px;height:1920px;overflow:hidden;position:relative;color:#f4f8f8;
       font-family:"Inter","Segoe UI","Helvetica Neue",Arial,sans-serif;}
  #stage{position:absolute;inset:0;background:#000;}
  .el{position:absolute;opacity:0;will-change:transform,opacity;}
  .c{left:0;right:0;text-align:center;}
  .title{top:300px;font-size:84px;font-weight:800;line-height:1.12;letter-spacing:-1.5px;padding:0 64px;}
  .title em{font-style:normal;color:#3DDBB0;}
  .sub{top:500px;font-size:48px;font-weight:600;color:#9fb5ba;padding:0 64px;}
  #phone{position:absolute;left:316px;top:600px;width:448px;height:930px;box-sizing:border-box;
         border-radius:70px;padding:14px;
         background:linear-gradient(150deg,#3b424b 0%,#14181d 22%,#0a0c0f 60%,#262c33 100%);
         box-shadow:inset 0 0 0 2px #4a525c, inset 0 0 0 5px #0a0c0f, 0 30px 70px rgba(0,0,0,.7);}
  #screen{position:absolute;left:14px;top:14px;width:420px;height:902px;border-radius:60px;overflow:hidden;background:#000;}
  #screen img{position:absolute;left:0;top:0;width:420px;height:902px;display:block;}
  #island{position:absolute;left:50%;top:24px;width:130px;height:40px;margin-left:-65px;border-radius:22px;background:#000;z-index:3;}
  #teamWrap{position:absolute;left:0;top:560px;width:1080px;height:920px;}
  #teamWrap svg{width:1080px;height:920px;overflow:visible;}
  .line{stroke:#3DDBB0;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(61,219,176,.45));}
  .lineB{stroke:#4c9cf0;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(76,156,240,.45));}
  .lineG{stroke:#3ec28a;stroke-width:10;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(62,194,138,.5));}
  .cta{left:150px;right:150px;top:1146px;height:140px;border-radius:80px;background:#3ec28a;color:#06241a;
       font-size:60px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap;
       box-shadow:0 0 70px rgba(62,194,138,.35);}
  .badge{left:240px;right:240px;top:1342px;height:100px;border-radius:24px;border:3px solid #9fb5ba;color:#f4f8f8;
         font-size:40px;font-weight:600;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="stage">

  <!-- 0.0 – 2.7: kanca -->
  <div class="el c title" id="hook">Müşteri borcunu <em>hâlâ kafanızda</em> mı tutuyorsunuz?</div>
  <svg id="qSvg" style="position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible;">
    <path id="qMark" class="line" d="M500 880 Q500 830 540 830 Q580 830 580 880 Q580 915 540 925 L540 960 M540 1000 L540 1010"/>
  </svg>

  <!-- 2.7 – 7.0: cari -->
  <div class="el c title" id="tCari">Her müşterinin <em>hesabı ayrı</em></div>
  <div class="el c sub" id="sCari">cari hesap, tek ekranda</div>

  <!-- 7.0 – 11.8: satış -->
  <div class="el c title" id="tSatis">Satışı, tahsilatı <em>tek dokunuşla</em> girin</div>
  <div class="el c sub" id="sSatis">bakiye anında güncellenir</div>

  <!-- 11.8 – 16.0: ekip -->
  <div class="el c title" id="tEkip">Çalışanınız da <em>kayıt girsin</em></div>
  <div class="el c sub" id="sEkip">kimin neyi göreceğine siz karar verin</div>

  <!-- Telefon: 2.7 – 11.8 -->
  <div id="phone">
    <div id="screen"><img id="scr" src="rec/f_0001.jpg"></div>
    <div id="island"></div>
  </div>

  <!-- Ekip grafiği: 11.8 – 16.0 -->
  <div id="teamWrap">
    <svg viewBox="0 0 720 920" preserveAspectRatio="xMidYMid meet">
      <g transform="translate(0,-360)">
        <rect id="cA" class="lineG" x="60" y="420" width="190" height="260" rx="28"/>
        <circle id="aA" class="lineG" cx="155" cy="500" r="48"/>
        <path id="bA" class="lineG" d="M95 640 Q95 575 155 575 Q215 575 215 640"/>
        <path id="nA" class="line" d="M100 640 H210 M120 668 H190"/>
        <path id="okA" class="lineG" d="M120 720 L146 746 L192 698"/>
        <rect id="cB" class="lineB" x="265" y="420" width="190" height="260" rx="28"/>
        <circle id="aB" class="lineB" cx="360" cy="500" r="48"/>
        <path id="bB" class="lineB" d="M300 640 Q300 575 360 575 Q420 575 420 640"/>
        <path id="nB" class="line" d="M305 640 H415 M325 668 H395"/>
        <path id="xB1" class="lineB" d="M320 705 L370 745 M370 705 L320 745"/>
        <rect id="cC" class="lineG" x="470" y="420" width="190" height="260" rx="28"/>
        <circle id="aC" class="lineG" cx="565" cy="500" r="48"/>
        <path id="bC" class="lineG" d="M505 640 Q505 575 565 575 Q625 575 625 640"/>
        <path id="nC" class="line" d="M510 640 H620 M530 668 H600"/>
        <path id="okC" class="lineG" d="M525 720 L551 746 L597 698"/>
      </g>
    </svg>
  </div>

  <!-- 16.0 – 19.0: kapanış -->
  <img class="el" id="logo" src="logo_app.png" style="left:390px;top:640px;width:300px;height:300px;border-radius:66px;box-shadow:0 0 80px rgba(61,219,176,.25);">
  <div class="el c title" id="tBrand" style="top:996px;">Hesabım <em>Muhasebe</em></div>
  <div class="el cta" id="cta">Ücretsiz indirin</div>
  <img class="el" id="badge" src="badge_en.png" style="left:330px;top:1342px;width:420px;height:140px;">
</div>

<script>
  const $ = id => document.getElementById(id);
  const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const ease = x => 1 - Math.pow(1-clamp(x), 3);
  const smooth = x => { x = clamp(x); return x*x*(3-2*x); };

  function show(el, t, t0, t1, rise=24){
    if (t < t0 || t >= t1){ el.style.opacity = 0; return; }
    const p = ease((t - t0)/0.4);
    el.style.opacity = p;
    el.style.transform = `translateY(${(1-p)*rise}px)`;
  }
  function draw(el, t, t0, dur, t1=Infinity){
    if (!el.__len) el.__len = el.getTotalLength ? el.getTotalLength() : 200;
    const L = el.__len;
    if (t < t0 || t >= t1){ el.style.strokeDasharray = L; el.style.strokeDashoffset = L; return; }
    const p = clamp((t - t0)/dur);
    el.style.strokeDasharray = L;
    el.style.strokeDashoffset = L*(1 - ease(p));
  }
  function drawAll(ids, t, t0, dur, step, t1=Infinity){
    ids.forEach((id, i) => draw($(id), t, t0 + i*step, dur, t1));
  }

  // Telefon kaynakları: video zamanına göre klip zamanı (sn).
  // Cari: 2.7–7.0 → klip 0.5–4.8 ; Satış: 7.0–11.8 → klip 2.5–7.3
  const PH = [
    { a: 3.1, b: 6.9, c0: 0.5, zooms: [{a:1.6, b:2.9, s:1.22, ox:0.5, oy:0.4}] },
    { a: 7.0, b: 11.7, c0: 2.5, zooms: [{a:4.2, b:6.0, s:1.16, ox:0.65, oy:0.7}] },
  ];
  const RAMP = 0.25;
  let cur = '';
  async function setSrc(src){
    if (cur === src) return;
    cur = src;
    const img = $('scr');
    img.src = src;
    await img.decode().catch(()=>{});
  }

  window.render = async function(t){
    // Kanca (0 – 2.7): kelime kelime, ilk 0,3 sn içinde hareket
    show($('hook'), t, 0.0, 3.1, 18);
    drawAll(['qMark'], t, 0.2, 0.5, 0, 2.8);

    // Telefon (2.7 – 11.8)
    const phone = $('phone');
    const scr = $('scr');
    let seg = PH.find(s => t >= s.a && t < s.b);
    if (seg){
      const ct = seg.c0 + (t - seg.a);
      const idx = Math.min(241, Math.floor(ct*30) + 1);
      await setSrc(`rec/f_${String(idx).padStart(4,'0')}.jpg`);
      let s = 1, ox = 0.5, oy = 0.5;
      for (const z of seg.zooms){
        const w = smooth((ct - z.a)/RAMP) * (1 - smooth((ct - z.b)/RAMP));
        if (w > 0){ s = 1 + (z.s - 1)*w; ox = z.ox; oy = z.oy; break; }
      }
      const fade = ease(clamp((t - seg.a)/0.35));
      phone.style.opacity = fade;
      scr.style.transformOrigin = `${ox*100}% ${oy*100}%`;
      scr.style.transform = `scale(${s})`;
    } else {
      phone.style.opacity = 0; scr.style.transform = 'scale(1)';
    }

    // Başlıklar
    show($('tCari'), t, 3.1, 6.95, 20);  show($('sCari'), t, 3.2, 6.95, 16);
    show($('tSatis'), t, 7.0, 11.75, 20); show($('sSatis'), t, 9.8, 11.75, 16);
    show($('tEkip'), t, 11.9, 15.8, 20); show($('sEkip'), t, 13.6, 15.8, 16);

    // Ekip kartları (11.8 – 16.0)
    drawAll(['cA','aA','bA','nA'], t, 11.8, 0.4, 0.06, 16.0);
    drawAll(['okA'], t, 12.5, 0.35, 0, 16.0);
    drawAll(['cB','aB','bB','nB'], t, 12.1, 0.4, 0.06, 16.0);
    drawAll(['xB1'], t, 12.8, 0.35, 0, 16.0);
    drawAll(['cC','aC','bC','nC'], t, 12.4, 0.4, 0.06, 16.0);
    drawAll(['okC'], t, 13.1, 0.35, 0, 16.0);

    // Kapanış (16.0 – 19.0)
    show($('logo'), t, 16.0, 20.2, 10);
    show($('tBrand'), t, 16.1, 20.2, 14);
    show($('cta'), t, 17.3, 20.2, 14);
    show($('badge'), t, 17.9, 18.6, 14);
  };

  window.render(0);
</script>
</body>
</html>
